alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Urlbox
serviceCategory: Web and Application Services
billingModel:
  pricingCategory: Usage-Based
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
  - Usage
  - Purchase
  - Adjustment
focusColumns:
  ServiceName: Urlbox
  ServiceCategory: Web and Application Services
  ProviderName: Urlbox
  PublisherName: Urlbox
  InvoiceIssuerName: Urlbox
  BillingCurrency: USD
  ChargeCategory: Usage
  PricingCategory: Usage-Based
meters:
- name: renders
  description: Billable renders (screenshot, PDF, or video) generated in the billing period, counted against the plan allowance.
  unit: renders
  aggregation: sum
  dimensions:
  - account
  - project
  - format
- name: cached_renders
  description: Renders served from cache; not counted against quota and not billed.
  unit: renders
  aggregation: sum
  dimensions:
  - account
  - project
- name: overage_renders
  description: Renders beyond the plan allowance, billed per 1,000 additional renders or via automatic tier upgrade.
  unit: renders
  aggregation: sum
  dimensions:
  - account
  - project
- name: bandwidth
  description: Bandwidth consumed loading target pages, reported per render in the result payload.
  unit: bytes
  aggregation: sum
  dimensions:
  - account
  - project
- name: subscription_fee
  description: Fixed monthly subscription fee for the active tier (Lo-Fi, Hi-Fi, Ultra, Business, Enterprise).
  unit: months
  aggregation: sum
  dimensions:
  - account
  - tier
principles:
- name: Visibility
  description: Read x-renders-used / x-renders-allowed / x-renders-remaining headers and the usage endpoint to track render burn against quota in real time.
- name: Allocation
  description: Use separate projects and API keys per workload/team to attribute render spend to cost centers.
- name: Optimization
  description: Maximize cache reuse (avoid unnecessary force/unique), set appropriate ttl, right-size the tier to monthly render volume, and batch via async to smooth RPM.
- name: Accountability
  description: Assign owners per project; review monthly render volume against the plan allowance to avoid surprise automatic tier upgrades.
