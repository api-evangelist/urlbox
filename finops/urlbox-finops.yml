description: >-
  FinOps view of Urlbox spend. Urlbox bills on a per-render basis within fixed
  monthly subscription tiers, each bundling an included render allowance and an
  effective per-1,000-render rate. Higher tiers lower the marginal cost per
  render; over-quota usage triggers automatic tier upgrades, and renders served
  from cache are free. Cost optimization centers on cache reuse, right-sizing the
  tier to monthly render volume, and avoiding force/unique cache busting.
notes: >-
  Per-render rates and tier allowances are subject to change; verify against the
  Urlbox pricing page during reconciliation.
sources:
- https://urlbox.com/pricing
- https://urlbox.com/docs
